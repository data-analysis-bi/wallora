name: Wallora
options:
  bundleIdPrefix: com.wallora
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  Wallora:
    type: application
    platform: iOS
    sources: [Wallora, Shared]
    dependencies:
      - target: WalloraWidgets
    entitlements:
      path: Wallora/Wallora.entitlements
      properties:
        com.apple.security.application-groups: [group.com.wallora.app]
    info:
      path: Wallora/Info.plist
      properties:
        CFBundleDisplayName: Wallora
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSPhotoLibraryAddUsageDescription: Wallora saves wallpapers you choose to your Photos library.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wallora.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  WalloraWidgets:
    type: app-extension
    platform: iOS
    sources: [WalloraWidgets, Shared]
    entitlements:
      path: WalloraWidgets/WalloraWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.wallora.app]
    info:
      path: WalloraWidgets/Info.plist
      properties:
        CFBundleDisplayName: Wallora Widgets
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wallora.app.widgets

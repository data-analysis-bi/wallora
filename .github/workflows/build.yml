name: Build unsigned IPA
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: brew install xcodegen ldid
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild -project Wallora.xcodeproj -scheme Wallora \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build \
            2>&1 | tee build.log
      - name: Show errors only
        if: failure()
        run: grep -E "error:|\*\* BUILD FAILED" build.log | sort -u | head -40
      - name: Package IPA (embed entitlements so App Groups survive re-signing)
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/Wallora.app Payload/
          ldid -SWallora/Wallora.entitlements Payload/Wallora.app/Wallora
          ldid -SWalloraWidgets/WalloraWidgets.entitlements Payload/Wallora.app/PlugIns/WalloraWidgets.appex/WalloraWidgets
          zip -qr Wallora.ipa Payload
      - uses: actions/upload-artifact@v5
        with:
          name: Wallora-ipa
          path: Wallora.ipa
